<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Temp Mail Pro - Ultimate</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Space Grotesk', 'sans-serif'] },
                    colors: { brand: { 50: '#f5f3ff', 100: '#ede9fe', 500: '#8b5cf6', 600: '#7c3aed', 900: '#4c1d95' } },
                    animation: { 'slide-up': 'slideUp 0.4s ease-out' },
                    keyframes: { slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } } }
                }
            }
        }
    </script>

    <style>
        body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .loader-bar { width: 0%; height: 4px; background: linear-gradient(90deg, #8b5cf6, #ec4899); transition: width 0.2s ease; border-radius: 99px; }
        .email-frame { width: 100%; height: 100%; border: none; display: block; }
        .toast-enter { transform: translateY(100%); opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .toast-visible { transform: translateY(0); opacity: 1; }
        .fab { position: fixed; bottom: 90px; right: 20px; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4); }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300 h-screen overflow-hidden flex flex-col relative">

    <!-- SPLASH SCREEN -->
    <div id="splash-screen" class="fixed inset-0 z-50 bg-white dark:bg-gray-900 flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="text-center">
            <span class="material-symbols-rounded text-6xl text-brand-500 mb-4">mail</span>
            <h1 class="text-3xl font-bold tracking-tight mb-1">Temp Mail</h1>
            <p class="text-gray-500 text-sm mb-8">Connecting to Server...</p>
            <div class="w-48 h-1 bg-gray-200 dark:bg-gray-800 rounded-full overflow-hidden">
                <div id="loading-bar" class="loader-bar"></div>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="flex-none px-5 py-4 flex items-center justify-between bg-white/80 dark:bg-gray-900/80 backdrop-blur-md sticky top-0 z-30 border-b border-gray-100 dark:border-gray-800">
        <div class="flex items-center gap-2">
            <span class="material-symbols-rounded text-brand-500">mark_email_unread</span>
            <span class="font-bold text-lg tracking-tight">Temp Mail</span>
        </div>
        <button id="theme-toggle" class="p-2 rounded-full bg-gray-100 dark:bg-gray-800">
            <span class="material-symbols-rounded">dark_mode</span>
        </button>
    </header>

    <main class="flex-1 overflow-y-auto no-scrollbar p-4 pb-32">
        <!-- Control Card -->
        <section class="bg-white dark:bg-gray-800 rounded-3xl p-5 shadow-sm border border-gray-100 dark:border-gray-700 mb-6 relative overflow-hidden animate-slide-up">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-brand-500 to-pink-500"></div>
            
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-medium uppercase tracking-wider text-gray-400">Your Address</span>
                <span id="timer-display" class="text-xs font-bold text-brand-500 bg-brand-50 dark:bg-brand-900/30 px-2 py-1 rounded-md">10:00</span>
            </div>

            <div class="relative mb-5">
                <div id="email-address" class="text-lg sm:text-xl font-bold break-all text-gray-900 dark:text-white"><span class="pulse">Generating...</span></div>
                <button onclick="copyEmail()" class="mt-3 w-full py-2.5 bg-brand-500 text-white rounded-xl font-medium flex items-center justify-center gap-2 active:scale-95 transition-all">
                    <span class="material-symbols-rounded text-lg">content_copy</span> Copy Email
                </button>
            </div>

            <div class="grid grid-cols-3 gap-2">
                <button onclick="generateEmail()" class="flex flex-col items-center justify-center p-3 rounded-xl bg-gray-50 dark:bg-gray-700/50">
                    <span class="material-symbols-rounded text-blue-500">sync_alt</span>
                    <span class="text-[10px] font-bold">CHANGE</span>
                </button>
                <button onclick="resetTimer()" class="flex flex-col items-center justify-center p-3 rounded-xl bg-gray-50 dark:bg-gray-700/50">
                    <span class="material-symbols-rounded text-orange-500">timer</span>
                    <span class="text-[10px] font-bold">EXTEND</span>
                </button>
                <button onclick="location.reload()" class="flex flex-col items-center justify-center p-3 rounded-xl bg-gray-50 dark:bg-gray-700/50">
                    <span class="material-symbols-rounded text-red-500">delete</span>
                    <span class="text-[10px] font-bold">DELETE</span>
                </button>
            </div>
        </section>

        <!-- Inbox List -->
        <div class="flex items-center justify-between mb-3 px-1">
            <h2 class="text-lg font-bold">Inbox <span id="inbox-count" class="bg-gray-200 dark:bg-gray-700 text-xs px-2 py-0.5 rounded-full">0</span></h2>
            <button onclick="fetchMessages()" class="p-2 text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full">
                <span class="material-symbols-rounded">refresh</span>
            </button>
        </div>

        <ul id="inbox-list" class="space-y-3 mb-6">
            <li class="flex flex-col items-center justify-center py-10 text-center opacity-60">
                <span class="material-symbols-rounded text-4xl mb-2">inbox</span>
                <p class="text-sm">Inbox is empty</p>
            </li>
        </ul>

        <!-- Contact Support -->
        <section class="mt-8 mb-6">
            <div class="flex items-center gap-2 mb-4 px-1">
                <span class="material-symbols-rounded text-brand-500">support_agent</span>
                <h2 class="text-lg font-bold">Contact Support</h2>
            </div>
            <div class="bg-white dark:bg-gray-800 rounded-3xl p-5 shadow-sm border border-gray-100 dark:border-gray-700">
                <div class="grid grid-cols-5 gap-3">
                    <a href="https://facebook.com/MD.RASEL.8.2.3.4" target="_blank" class="flex flex-col items-center gap-2">
                        <div class="w-12 h-12 rounded-2xl bg-blue-50 dark:bg-blue-900/20 flex items-center justify-center text-blue-600"><span class="material-symbols-rounded">facebook</span></div>
                        <span class="text-[10px]">FB</span>
                    </a>
                    <a href="https://wa.me/8801882278234" target="_blank" class="flex flex-col items-center gap-2">
                        <div class="w-12 h-12 rounded-2xl bg-green-50 dark:bg-green-900/20 flex items-center justify-center text-green-600"><span class="material-symbols-rounded">chat</span></div>
                        <span class="text-[10px]">WA</span>
                    </a>
                    <a href="mailto:alexraselchodhury@gmail.com" class="flex flex-col items-center gap-2">
                        <div class="w-12 h-12 rounded-2xl bg-red-50 dark:bg-red-900/20 flex items-center justify-center text-red-600"><span class="material-symbols-rounded">mail</span></div>
                        <span class="text-[10px]">Mail</span>
                    </a>
                    <a href="https://t.me/HANTER_XD_OFFICIAL" target="_blank" class="flex flex-col items-center gap-2">
                        <div class="w-12 h-12 rounded-2xl bg-sky-50 dark:bg-sky-900/20 flex items-center justify-center text-sky-500"><span class="material-symbols-rounded">send</span></div>
                        <span class="text-[10px]">TG</span>
                    </a>
                    <a href="https://instagram.com/_md_rasel_34" target="_blank" class="flex flex-col items-center gap-2">
                        <div class="w-12 h-12 rounded-2xl bg-pink-50 dark:bg-pink-900/20 flex items-center justify-center text-pink-600"><span class="material-symbols-rounded">photo_camera</span></div>
                        <span class="text-[10px]">IG</span>
                    </a>
                </div>
            </div>
        </section>
        <div class="text-center pb-8"><p class="text-xs text-gray-400">Developed by <span class="text-brand-500 font-bold">MD RASEL</span></p></div>
    </main>

    <!-- VIEWER MODAL -->
    <div id="email-view" class="fixed inset-0 z-50 bg-white dark:bg-gray-900 transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="px-5 py-4 border-b dark:border-gray-800 flex items-center justify-between">
            <button onclick="closeEmail()" class="p-2"><span class="material-symbols-rounded">arrow_back</span></button>
            <span class="font-bold">Email Message</span>
            <div class="w-10"></div>
        </div>
        <div id="view-meta" class="p-5 bg-gray-50 dark:bg-gray-800"></div>
        <iframe id="view-frame" class="flex-1 w-full bg-white"></iframe>
    </div>

    <!-- BOTTOM BUTTONS -->
    <div class="fixed bottom-0 left-0 w-full p-4 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md grid grid-cols-2 gap-3 border-t dark:border-gray-800">
        <a href="https://github.com/HANTER-XD-OFFICIAL/TEMP-MAIL/releases/tag/TEMP-MAIL_APK" target="_blank" class="bg-gray-900 dark:bg-white text-white dark:text-gray-900 py-3 rounded-2xl font-bold text-center text-sm">Download APK</a>
        <button onclick="generateEmail()" class="bg-brand-500 text-white py-3 rounded-2xl font-bold text-sm">New Email</button>
    </div>

    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-[60] px-6 py-3 bg-gray-800 text-white rounded-full text-xs font-bold opacity-0 transition-opacity"></div>

    <script>
        const API = "https://www.1secmail.com/api/v1/";
        const PROXY = "https://api.codetabs.com/v1/proxy?quest=";
        let state = { user: '', domain: '', full: '', messages: [], timer: 600 };

        async function fetchAPI(url) {
            try {
                const res = await fetch(PROXY + encodeURIComponent(url));
                return await res.json();
            } catch (e) {
                // If proxy fails, try direct
                const res = await fetch(url);
                return await res.json();
            }
        }

        async function generateEmail() {
            document.getElementById('email-address').innerHTML = '<span class="pulse">Generating...</span>';
            const res = await fetchAPI(API + "?action=genEmailAddresses&count=1");
            if (res && res[0]) {
                state.full = res[0];
                [state.user, state.domain] = res[0].split('@');
                document.getElementById('email-address').innerText = state.full;
                showToast("New Email Ready!");
                state.messages = [];
                renderInbox();
                fetchMessages();
            }
        }

        async function fetchMessages() {
            if (!state.user) return;
            const msgs = await fetchAPI(`${API}?action=getMessages&login=${state.user}&domain=${state.domain}`);
            if (msgs && msgs.length !== state.messages.length) {
                state.messages = msgs;
                if(msgs.length > 0) showToast("New Message Received!");
                renderInbox();
            }
        }

        function renderInbox() {
            const list = document.getElementById('inbox-list');
            document.getElementById('inbox-count').innerText = state.messages.length;
            if (state.messages.length === 0) {
                list.innerHTML = '<li class="text-center py-10 opacity-60">Inbox is empty</li>';
                return;
            }
            list.innerHTML = '';
            state.messages.forEach(m => {
                const li = document.createElement('li');
                li.className = "bg-white dark:bg-gray-800 p-4 rounded-2xl border dark:border-gray-700 active:scale-95 transition-all cursor-pointer";
                li.onclick = () => openEmail(m.id);
                li.innerHTML = `
                    <div class="flex justify-between mb-1">
                        <span class="font-bold text-sm text-brand-600">${m.from}</span>
                        <span class="text-[10px] opacity-50">${m.date.split(' ')[1]}</span>
                    </div>
                    <div class="text-xs opacity-70 truncate">${m.subject}</div>
                `;
                list.appendChild(li);
            });
        }

        async function openEmail(id) {
            const data = await fetchAPI(`${API}?action=readMessage&login=${state.user}&domain=${state.domain}&id=${id}`);
            document.getElementById('view-meta').innerHTML = `
                <div class="text-xs font-bold text-brand-500 mb-1">FROM: ${data.from}</div>
                <div class="text-sm font-bold">${data.subject}</div>
            `;
            document.getElementById('view-frame').srcdoc = data.htmlBody || `<div style="font-family:sans-serif;padding:20px">${data.textBody}</div>`;
            document.getElementById('email-view').classList.remove('translate-x-full');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.classList.add('opacity-100');
            setTimeout(() => t.classList.remove('opacity-100'), 3000);
        }

        function copyEmail() {
            navigator.clipboard.writeText(state.full);
            showToast("Copied to clipboard!");
        }

        function closeEmail() { document.getElementById('email-view').classList.add('translate-x-full'); }
        function resetTimer() { state.timer = 600; showToast("Timer Extended"); }

        setInterval(() => {
            if (state.timer > 0) {
                state.timer--;
                const m = Math.floor(state.timer / 60), s = state.timer % 60;
                document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0'+s : s}`;
            }
        }, 1000);

        setInterval(fetchMessages, 8000);

        window.onload = () => {
            document.getElementById('theme-toggle').onclick = () => document.documentElement.classList.toggle('dark');
            document.getElementById('loading-bar').style.width = '100%';
            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                setTimeout(() => { document.getElementById('splash-screen').remove(); generateEmail(); }, 500);
            }, 1000);
        };
    </script>
</body>
</html>
