<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Temp Mail Pro - Ultimate</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Space Grotesk', 'sans-serif'] },
                    colors: { brand: { 50: '#f5f3ff', 100: '#ede9fe', 500: '#8b5cf6', 600: '#7c3aed', 900: '#4c1d95' } }
                }
            }
        }
    </script>

    <style>
        body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .loader-bar { width: 0%; height: 4px; background: linear-gradient(90deg, #8b5cf6, #ec4899); transition: width 0.2s ease; border-radius: 99px; }
        .email-frame { width: 100%; height: 100%; border: none; display: block; }
        .toast-enter { transform: translateY(100%); opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .toast-visible { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300 h-screen overflow-hidden flex flex-col relative">

    <!-- SPLASH SCREEN -->
    <div id="splash-screen" class="fixed inset-0 z-50 bg-white dark:bg-gray-900 flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="text-center">
            <span class="material-symbols-rounded text-6xl text-brand-500 mb-4">mail</span>
            <h1 class="text-3xl font-bold tracking-tight mb-1">Temp Mail</h1>
            <p class="text-gray-500 text-sm mb-8" id="loading-text">Bypassing restrictions...</p>
            <div class="w-48 h-1 bg-gray-200 dark:bg-gray-800 rounded-full overflow-hidden">
                <div id="loading-bar" class="loader-bar"></div>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="flex-none px-5 py-4 flex items-center justify-between bg-white/80 dark:bg-gray-900/80 backdrop-blur-md sticky top-0 z-30 border-b border-gray-100 dark:border-gray-800">
        <div class="flex items-center gap-2">
            <span class="material-symbols-rounded text-brand-500">mark_email_unread</span>
            <span class="font-bold text-lg tracking-tight">Temp Mail</span>
        </div>
        <button id="theme-toggle" class="p-2 rounded-full bg-gray-100 dark:bg-gray-800"><span class="material-symbols-rounded">dark_mode</span></button>
    </header>

    <main class="flex-1 overflow-y-auto no-scrollbar p-4 pb-32">
        <!-- Control Card -->
        <section class="bg-white dark:bg-gray-800 rounded-3xl p-5 shadow-sm border border-gray-100 dark:border-gray-700 mb-6 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-brand-500 to-pink-500"></div>
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-medium uppercase tracking-wider text-gray-400">Address Status</span>
                <span id="timer-display" class="text-xs font-bold text-brand-500 bg-brand-50 dark:bg-brand-900/30 px-2 py-1 rounded-md">10:00</span>
            </div>
            <div class="relative mb-5">
                <div id="email-address" class="text-lg font-bold break-all text-gray-900 dark:text-white">Connecting...</div>
                <button onclick="copyToClipboard()" class="mt-3 w-full py-2.5 bg-brand-500 text-white rounded-xl font-medium flex items-center justify-center gap-2 active:scale-95 transition-all">
                    <span class="material-symbols-rounded text-lg">content_copy</span> Copy Email
                </button>
            </div>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="generateEmail()" class="flex flex-col items-center p-3 rounded-xl bg-gray-50 dark:bg-gray-700/50">
                    <span class="material-symbols-rounded text-blue-500">sync_alt</span><span class="text-[10px] font-bold">CHANGE</span>
                </button>
                <button onclick="extendTimer()" class="flex flex-col items-center p-3 rounded-xl bg-gray-50 dark:bg-gray-700/50">
                    <span class="material-symbols-rounded text-orange-500">timer</span><span class="text-[10px] font-bold">EXTEND</span>
                </button>
                <button onclick="location.reload()" class="flex flex-col items-center p-3 rounded-xl bg-gray-50 dark:bg-gray-700/50">
                    <span class="material-symbols-rounded text-red-500">refresh</span><span class="text-[10px] font-bold">RESET</span>
                </button>
            </div>
        </section>

        <!-- Inbox -->
        <div class="flex items-center justify-between mb-3 px-1">
            <h2 class="text-lg font-bold">Inbox <span id="inbox-count" class="bg-gray-200 dark:bg-gray-700 text-xs px-2 py-0.5 rounded-full">0</span></h2>
            <button onclick="fetchMessages()" class="p-2 text-gray-500"><span class="material-symbols-rounded">refresh</span></button>
        </div>
        <ul id="inbox-list" class="space-y-3 mb-6">
            <li class="flex flex-col items-center py-10 text-center opacity-60"><p class="text-sm">Inbox is empty</p></li>
        </ul>
    </main>

    <!-- EMAIL VIEWER -->
    <div id="email-view" class="fixed inset-0 z-40 bg-white dark:bg-gray-900 transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="px-5 py-4 border-b border-gray-100 dark:border-gray-800 flex items-center gap-4">
            <button onclick="closeEmailView()" class="p-2"><span class="material-symbols-rounded">arrow_back</span></button>
            <h2 class="font-bold truncate">Message</h2>
        </div>
        <iframe id="view-frame" class="flex-1 w-full" sandbox="allow-popups"></iframe>
    </div>

    <!-- TOAST -->
    <div id="toast-container" class="fixed bottom-24 left-0 right-0 flex flex-col items-center gap-2 z-50 px-4 pointer-events-none"></div>

    <script>
        const API_BASE = "https://api.mail.gw";
        const PROXIES = [
            "https://corsproxy.io/?", 
            "https://api.allorigins.win/raw?url=",
            "https://thingproxy.freeboard.io/fetch/"
        ];
        let currentProxyIdx = 0;
        let appState = { email: null, password: null, token: null, messages: [], timer: 600 };

        async function secureFetch(endpoint, options = {}) {
            const url = API_BASE + endpoint;
            const headers = { 'Content-Type': 'application/json', ...options.headers };
            if (appState.token) headers['Authorization'] = `Bearer ${appState.token}`;

            // Try Direct first, then cycle through proxies
            for (let i = -1; i < PROXIES.length; i++) {
                try {
                    const finalUrl = i === -1 ? url : PROXIES[i] + encodeURIComponent(url);
                    const res = await fetch(finalUrl, { 
                        method: options.method || 'GET', 
                        headers, 
                        body: options.body,
                        mode: 'cors'
                    });
                    if (res.ok) return await res.json();
                    if (res.status === 401) return 'UNAUTHORIZED';
                } catch (e) {
                    console.warn(`Attempt ${i+2} failed...`);
                }
            }
            return null;
        }

        async function generateEmail() {
            document.getElementById('email-address').innerText = "Connecting...";
            const domains = await secureFetch('/domains');
            if (!domains || !domains['hydra:member']) {
                showToast("Network Error: All proxies failed", "error");
                document.getElementById('email-address').innerText = "Retry connection";
                return;
            }

            const domain = domains['hydra:member'][0].domain;
            const user = Math.random().toString(36).substring(2, 10);
            const pass = Math.random().toString(36).substring(2, 12);
            const email = `${user}@${domain}`;

            const acc = await secureFetch('/accounts', { 
                method: 'POST', 
                body: JSON.stringify({ address: email, password: pass }) 
            });

            if (acc) {
                const tokenRes = await secureFetch('/token', { 
                    method: 'POST', 
                    body: JSON.stringify({ address: email, password: pass }) 
                });
                if (tokenRes && tokenRes.token) {
                    appState.email = email; appState.token = tokenRes.token;
                    document.getElementById('email-address').innerText = email;
                    showToast("Email Active", "success");
                    fetchMessages();
                }
            }
        }

        async function fetchMessages() {
            if (!appState.token) return;
            const data = await secureFetch('/messages');
            if (data === 'UNAUTHORIZED') return generateEmail();
            if (data && data['hydra:member']) {
                appState.messages = data['hydra:member'];
                renderInbox();
            }
        }

        function renderInbox() {
            const list = document.getElementById('inbox-list');
            document.getElementById('inbox-count').innerText = appState.messages.length;
            list.innerHTML = appState.messages.length ? '' : '<li class="text-center py-10 opacity-60">Inbox is empty</li>';
            appState.messages.forEach(msg => {
                const li = document.createElement('li');
                li.className = "bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 cursor-pointer";
                li.onclick = async () => {
                    const full = await secureFetch(`/messages/${msg.id}`);
                    document.getElementById('view-frame').srcdoc = full.html ? full.html[0] : full.text;
                    document.getElementById('email-view').classList.remove('translate-x-full');
                };
                li.innerHTML = `<div class="font-bold text-sm">${msg.from.address}</div><div class="text-xs opacity-70 truncate">${msg.subject}</div>`;
                list.appendChild(li);
            });
        }

        function showToast(msg, type) {
            const container = document.getElementById('toast-container');
            const div = document.createElement('div');
            const bg = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            div.className = `${bg} text-white px-6 py-3 rounded-2xl shadow-xl toast-enter`;
            div.innerText = msg;
            container.appendChild(div);
            setTimeout(() => div.classList.add('toast-visible'), 10);
            setTimeout(() => { div.classList.remove('toast-visible'); setTimeout(() => div.remove(), 300); }, 3000);
        }

        function startTimer() {
            setInterval(() => {
                appState.timer--;
                const m = Math.floor(appState.timer / 60), s = appState.timer % 60;
                document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0'+s : s}`;
            }, 1000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('loading-bar').style.width = '100%';
            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                setTimeout(() => document.getElementById('splash-screen').remove(), 500);
            }, 1000);
            generateEmail(); startTimer();
            setInterval(fetchMessages, 10000);
            document.getElementById('theme-toggle').onclick = () => document.documentElement.classList.toggle('dark');
        });

        function closeEmailView() { document.getElementById('email-view').classList.add('translate-x-full'); }
        function copyToClipboard() { navigator.clipboard.writeText(appState.email).then(() => showToast("Copied!", "success")); }
        function extendTimer() { appState.timer = 600; showToast("Timer Reset", "success"); }
    </script>
</body>
</html>
