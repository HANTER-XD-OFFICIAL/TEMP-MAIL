<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Temp Mail Pro - Anti-Block Edition</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Space Grotesk', 'sans-serif'] },
                    colors: { brand: { 500: '#8b5cf6', 600: '#7c3aed' } }
                }
            }
        }
    </script>

    <style>
        body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .loader-bar { width: 0%; height: 4px; background: linear-gradient(90deg, #8b5cf6, #ec4899); transition: width 0.3s ease; border-radius: 99px; }
        .email-frame { width: 100%; height: 100%; border: none; }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 h-screen flex flex-col relative transition-colors duration-300">

    <!-- SPLASH SCREEN -->
    <div id="splash-screen" class="fixed inset-0 z-50 bg-white dark:bg-gray-900 flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="text-center">
            <span class="material-symbols-rounded text-6xl text-brand-500 mb-4">mail</span>
            <h1 class="text-3xl font-bold mb-1 tracking-tight">Temp Mail</h1>
            <p class="text-gray-400 text-sm mb-8">Connecting Securely...</p>
            <div class="w-48 h-1 bg-gray-100 dark:bg-gray-800 rounded-full overflow-hidden">
                <div id="loading-bar" class="loader-bar"></div>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="p-4 flex items-center justify-between border-b border-gray-100 dark:border-gray-800 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md sticky top-0 z-30">
        <div class="flex items-center gap-2">
            <span class="material-symbols-rounded text-brand-500">mark_email_unread</span>
            <span class="font-bold text-lg">Temp Mail Pro</span>
        </div>
        <button onclick="document.documentElement.classList.toggle('dark')" class="p-2 bg-gray-100 dark:bg-gray-800 rounded-full">
            <span class="material-symbols-rounded">dark_mode</span>
        </button>
    </header>

    <!-- MAIN -->
    <main class="flex-1 overflow-y-auto p-4 pb-32 no-scrollbar">
        
        <!-- EMAIL CARD -->
        <section class="bg-white dark:bg-gray-800 rounded-3xl p-6 shadow-sm border border-gray-100 dark:border-gray-700 mb-6 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-brand-500 to-pink-500"></div>
            
            <div class="flex justify-between items-center mb-4">
                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Active Address</span>
                <span id="timer-display" class="text-xs font-bold text-brand-500 bg-brand-50 dark:bg-brand-900/30 px-2 py-1 rounded-lg">10:00</span>
            </div>

            <div id="email-display" class="text-xl font-bold text-gray-900 dark:text-white break-all mb-6 min-h-[2rem] flex items-center">
                <span class="pulse text-gray-300">Connecting to server...</span>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="copyEmail()" class="flex items-center justify-center gap-2 py-3.5 bg-brand-500 text-white rounded-2xl font-bold active:scale-95 transition-all shadow-lg shadow-brand-500/20">
                    <span class="material-symbols-rounded text-lg">content_copy</span> Copy
                </button>
                <button onclick="createNewEmail()" class="flex items-center justify-center gap-2 py-3.5 bg-gray-100 dark:bg-gray-700 rounded-2xl font-bold active:scale-95 transition-all">
                    <span class="material-symbols-rounded text-lg">sync</span> New
                </button>
            </div>
        </section>

        <!-- INBOX SECTION -->
        <div class="flex items-center justify-between mb-4 px-2">
            <h2 class="font-bold text-lg flex items-center gap-2">Inbox <span id="inbox-count" class="text-xs bg-gray-200 dark:bg-gray-700 px-2 py-0.5 rounded-full">0</span></h2>
            <button onclick="fetchMessages()" class="text-brand-500 text-sm font-bold flex items-center gap-1">
                <span class="material-symbols-rounded text-sm">refresh</span> Refresh
            </button>
        </div>

        <ul id="inbox-list" class="space-y-3">
            <li class="py-12 text-center text-gray-400">
                <span class="material-symbols-rounded text-4xl mb-2 opacity-20">mail_outline</span>
                <p class="text-sm">No messages yet</p>
            </li>
        </ul>
    </main>

    <!-- FOOTER -->
    <footer class="fixed bottom-0 left-0 w-full p-4 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-t border-gray-100 dark:border-gray-800 grid grid-cols-2 gap-3 z-30">
        <a href="https://t.me/HANTER_XD_OFFICIAL" target="_blank" class="flex items-center justify-center gap-2 py-3 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-2xl font-bold text-xs">
            <span class="material-symbols-rounded text-sm">support_agent</span> Support
        </a>
        <button onclick="createNewEmail()" class="flex items-center justify-center gap-2 py-3 bg-brand-500 text-white rounded-2xl font-bold text-xs shadow-lg shadow-brand-500/20">
            <span class="material-symbols-rounded text-sm">add</span> Create New
        </button>
    </footer>

    <!-- VIEW MODAL -->
    <div id="view-modal" class="fixed inset-0 z-50 bg-white dark:bg-gray-900 transform translate-y-full transition-transform duration-300 flex flex-col">
        <div class="p-4 border-b dark:border-gray-800 flex items-center justify-between">
            <button onclick="closeModal()" class="p-2 bg-gray-100 dark:bg-gray-800 rounded-full"><span class="material-symbols-rounded">close</span></button>
            <span class="font-bold">Email Content</span>
            <div class="w-10"></div>
        </div>
        <div id="email-meta" class="p-4 bg-gray-50 dark:bg-gray-800 border-b dark:border-gray-700"></div>
        <iframe id="email-frame" class="flex-1 w-full bg-white"></iframe>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed top-24 left-1/2 -translate-x-1/2 z-[60] px-6 py-3 bg-gray-800 text-white rounded-full text-xs font-bold shadow-2xl opacity-0 pointer-events-none transition-all duration-300"></div>

    <script>
        const API_URL = "https://api.mail.gw";
        const PROXIES = [
            "", // সরাসরি চেষ্টা
            "https://corsproxy.io/?", 
            "https://api.allorigins.win/raw?url="
        ];
        
        let state = { email: '', pass: '', token: '', messages: [], timer: 600, activeProxy: 0 };

        // সলিড রিকোয়েস্ট ফাংশন (প্রক্সি সহ)
        async function fetchAPI(path, options = {}) {
            const url = API_URL + path;
            const headers = { 'Content-Type': 'application/json', ...options.headers };
            if (state.token) headers['Authorization'] = `Bearer ${state.token}`;

            for (let i = 0; i < PROXIES.length; i++) {
                try {
                    const finalUrl = PROXIES[i] + encodeURIComponent(url);
                    const res = await fetch(PROXIES[i] === "" ? url : finalUrl, { 
                        ...options, 
                        headers,
                        mode: 'cors'
                    });
                    
                    if (res.ok) return await res.json();
                    if (res.status === 401) return { error: 'AUTH' };
                } catch (e) {
                    console.log(`Proxy ${i} failed, trying next...`);
                }
            }
            return { error: 'BLOCK' };
        }

        async function createNewEmail() {
            const display = document.getElementById('email-display');
            display.innerHTML = '<span class="pulse text-brand-500">Bypassing Network...</span>';

            const domains = await fetchAPI('/domains');
            if (domains.error) {
                display.innerHTML = '<span class="text-red-500 text-xs font-bold uppercase">Network Error: Use VPN or Try Again</span>';
                return;
            }

            const domain = domains['hydra:member'][0].domain;
            const user = Math.random().toString(36).substring(2, 10);
            const pass = Math.random().toString(36).substring(2, 12);
            const address = `${user}@${domain}`;

            const acc = await fetchAPI('/accounts', { 
                method: 'POST', 
                body: JSON.stringify({ address, password: pass }) 
            });

            if (acc.error) return createNewEmail();

            const token = await fetchAPI('/token', { 
                method: 'POST', 
                body: JSON.stringify({ address, password: pass }) 
            });

            if (token.token) {
                state.email = address; state.token = token.token;
                display.innerText = address;
                showToast("New Email Generated!");
                state.timer = 600;
                fetchMessages();
            }
        }

        async function fetchMessages() {
            if (!state.token) return;
            const data = await fetchAPI('/messages');
            if (data.error === 'AUTH') return createNewEmail();
            if (data['hydra:member']) {
                if (data['hydra:member'].length > state.messages.length) showToast("New Email Received!");
                state.messages = data['hydra:member'];
                renderInbox();
            }
        }

        function renderInbox() {
            const list = document.getElementById('inbox-list');
            document.getElementById('inbox-count').innerText = state.messages.length;
            
            if (state.messages.length === 0) {
                list.innerHTML = `<li class="py-12 text-center text-gray-400"><p class="text-sm">Inbox is empty</p></li>`;
                return;
            }

            list.innerHTML = '';
            state.messages.forEach(msg => {
                const li = document.createElement('li');
                li.className = "bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 cursor-pointer active:scale-95 transition-all";
                li.onclick = () => openEmail(msg.id, msg.from.address, msg.subject);
                li.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <span class="font-bold text-sm text-brand-500 truncate mr-4">${msg.from.address}</span>
                        <span class="text-[10px] text-gray-400 whitespace-nowrap">Just now</span>
                    </div>
                    <p class="text-xs font-medium text-gray-600 dark:text-gray-300 truncate">${msg.subject || '(No Subject)'}</p>
                `;
                list.appendChild(li);
            });
        }

        async function openEmail(id, from, subject) {
            document.getElementById('email-meta').innerHTML = `
                <div class="text-[10px] font-bold text-brand-500 mb-1">FROM: ${from}</div>
                <div class="text-sm font-bold">${subject}</div>
            `;
            document.getElementById('view-modal').classList.remove('translate-y-full');
            const data = await fetchAPI(`/messages/${id}`);
            const content = data.html ? data.html[0] : data.text;
            document.getElementById('email-frame').srcdoc = `
                <style>body{font-family:sans-serif;padding:20px;line-height:1.6;color:#333}img{max-width:100%}</style>
                ${content}
            `;
        }

        function closeModal() { document.getElementById('view-modal').classList.add('translate-y-full'); }
        
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2500);
        }

        function copyEmail() {
            if (!state.email) return;
            navigator.clipboard.writeText(state.email);
            showToast("Copied to clipboard!");
        }

        // TIMER
        setInterval(() => {
            if (state.timer > 0) {
                state.timer--;
                const m = Math.floor(state.timer / 60);
                const s = state.timer % 60;
                document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0'+s : s}`;
            }
        }, 1000);

        // INIT
        window.onload = () => {
            document.getElementById('loading-bar').style.width = '100%';
            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                setTimeout(() => document.getElementById('splash-screen').remove(), 500);
                createNewEmail();
                setInterval(fetchMessages, 10000);
            }, 1000);
        };
    </script>
</body>
</html>
