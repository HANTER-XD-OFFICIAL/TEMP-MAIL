<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Temp Mail Pro - Ultimate</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Space Grotesk', 'sans-serif'] },
                    colors: { brand: { 50: '#f5f3ff', 100: '#ede9fe', 500: '#8b5cf6', 600: '#7c3aed', 900: '#4c1d95' } }
                }
            }
        }
    </script>

    <style>
        body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .loader-bar { width: 0%; height: 4px; background: linear-gradient(90deg, #8b5cf6, #ec4899); transition: width 0.3s ease; border-radius: 99px; }
        .email-frame { width: 100%; height: 100%; border: none; display: block; }
        .toast-enter { transform: translateY(100%); opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .toast-visible { transform: translateY(0); opacity: 1; }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300 h-screen overflow-hidden flex flex-col relative">

    <!-- SPLASH SCREEN -->
    <div id="splash-screen" class="fixed inset-0 z-50 bg-white dark:bg-gray-900 flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="text-center">
            <span class="material-symbols-rounded text-6xl text-brand-500 mb-4">mail</span>
            <h1 class="text-3xl font-bold tracking-tight mb-1">Temp Mail</h1>
            <p class="text-gray-500 text-sm mb-8">Connecting to Server...</p>
            <div class="w-48 h-1 bg-gray-200 dark:bg-gray-800 rounded-full overflow-hidden">
                <div id="loading-bar" class="loader-bar"></div>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="flex-none px-5 py-4 flex items-center justify-between bg-white/80 dark:bg-gray-900/80 backdrop-blur-md sticky top-0 z-30 border-b border-gray-100 dark:border-gray-800">
        <div class="flex items-center gap-2">
            <span class="material-symbols-rounded text-brand-500">mark_email_unread</span>
            <span class="font-bold text-lg tracking-tight">Temp Mail</span>
        </div>
        <button id="theme-toggle" class="p-2 rounded-full bg-gray-100 dark:bg-gray-800">
            <span class="material-symbols-rounded">dark_mode</span>
        </button>
    </header>

    <main class="flex-1 overflow-y-auto no-scrollbar p-4 pb-32">
        <!-- Control Card -->
        <section class="bg-white dark:bg-gray-800 rounded-3xl p-5 shadow-sm border dark:border-gray-700 mb-6 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-brand-500 to-pink-500"></div>
            
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-medium uppercase tracking-wider text-gray-400">Your Address</span>
                <span id="timer-display" class="text-xs font-bold text-brand-500 bg-brand-50 dark:bg-brand-900/30 px-2 py-1 rounded-md">10:00</span>
            </div>

            <div class="relative mb-5">
                <div id="email-address" class="text-lg sm:text-xl font-bold break-all text-gray-900 dark:text-white"><span class="pulse text-gray-400">Initializing...</span></div>
                <button onclick="copyToClipboard()" class="mt-3 w-full py-2.5 bg-brand-500 text-white rounded-xl font-medium flex items-center justify-center gap-2 active:scale-95 transition-all">
                    <span class="material-symbols-rounded text-lg">content_copy</span> Copy Address
                </button>
            </div>

            <div class="grid grid-cols-3 gap-2">
                <button onclick="generateNewEmail()" class="flex flex-col items-center justify-center p-3 rounded-xl bg-gray-50 dark:bg-gray-700/50">
                    <span class="material-symbols-rounded text-blue-500">sync_alt</span>
                    <span class="text-[10px] font-bold">CHANGE</span>
                </button>
                <button onclick="resetTimer()" class="flex flex-col items-center justify-center p-3 rounded-xl bg-gray-50 dark:bg-gray-700/50">
                    <span class="material-symbols-rounded text-orange-500">timer</span>
                    <span class="text-[10px] font-bold">EXTEND</span>
                </button>
                <button onclick="location.reload()" class="flex flex-col items-center justify-center p-3 rounded-xl bg-gray-50 dark:bg-gray-700/50">
                    <span class="material-symbols-rounded text-red-500">delete</span>
                    <span class="text-[10px] font-bold">DELETE</span>
                </button>
            </div>
        </section>

        <!-- Inbox -->
        <div class="flex items-center justify-between mb-3 px-1">
            <h2 class="text-lg font-bold">Inbox <span id="inbox-count" class="bg-gray-200 dark:bg-gray-700 text-xs px-2 py-0.5 rounded-full">0</span></h2>
            <button onclick="fetchMessages()" class="p-2 text-gray-500"><span class="material-symbols-rounded">refresh</span></button>
        </div>

        <ul id="inbox-list" class="space-y-3 mb-6">
            <li class="flex flex-col items-center justify-center py-10 text-center opacity-60">
                <span class="material-symbols-rounded text-4xl mb-2">inbox</span>
                <p class="text-sm">Inbox is empty</p>
            </li>
        </ul>

        <!-- Contact -->
        <section class="mt-8 mb-6">
            <div class="flex items-center gap-2 mb-4 px-1">
                <span class="material-symbols-rounded text-brand-500">support_agent</span>
                <h2 class="text-lg font-bold">Contact Support</h2>
            </div>
            <div class="bg-white dark:bg-gray-800 rounded-3xl p-5 shadow-sm border dark:border-gray-700">
                <div class="grid grid-cols-5 gap-3">
                    <a href="https://facebook.com/MD.RASEL.8.2.3.4" class="flex flex-col items-center"><div class="w-10 h-10 rounded-xl bg-blue-50 dark:bg-blue-900/20 flex items-center justify-center text-blue-600"><span class="material-symbols-rounded text-lg">facebook</span></div></a>
                    <a href="https://wa.me/8801882278234" class="flex flex-col items-center"><div class="w-10 h-10 rounded-xl bg-green-50 dark:bg-green-900/20 flex items-center justify-center text-green-600"><span class="material-symbols-rounded text-lg">chat</span></div></a>
                    <a href="mailto:alexraselchodhury@gmail.com" class="flex flex-col items-center"><div class="w-10 h-10 rounded-xl bg-red-50 dark:bg-red-900/20 flex items-center justify-center text-red-600"><span class="material-symbols-rounded text-lg">mail</span></div></a>
                    <a href="https://t.me/HANTER_XD_OFFICIAL" class="flex flex-col items-center"><div class="w-10 h-10 rounded-xl bg-sky-50 dark:bg-sky-900/20 flex items-center justify-center text-sky-500"><span class="material-symbols-rounded text-lg">send</span></div></a>
                    <a href="https://instagram.com/_md_rasel_34" class="flex flex-col items-center"><div class="w-10 h-10 rounded-xl bg-pink-50 dark:bg-pink-900/20 flex items-center justify-center text-pink-600"><span class="material-symbols-rounded text-lg">camera</span></div></a>
                </div>
            </div>
        </section>
        <div class="text-center pb-12"><p class="text-xs text-gray-400">Developed by <span class="text-brand-500 font-bold">MD RASEL</span></p></div>
    </main>

    <!-- EMAIL VIEWER -->
    <div id="email-view" class="fixed inset-0 z-50 bg-white dark:bg-gray-900 transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="px-5 py-4 border-b dark:border-gray-800 flex items-center justify-between">
            <button onclick="closeEmail()" class="p-2"><span class="material-symbols-rounded">arrow_back</span></button>
            <h2 class="font-bold truncate">Message</h2>
            <div class="w-10"></div>
        </div>
        <div id="view-meta" class="p-5 border-b dark:border-gray-700 bg-gray-50 dark:bg-gray-800"></div>
        <iframe id="view-frame" class="flex-1 w-full bg-white"></iframe>
    </div>

    <!-- BOTTOM NAV -->
    <div class="fixed bottom-0 left-0 w-full p-4 grid grid-cols-2 gap-3 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-t dark:border-gray-800">
        <a href="https://github.com/HANTER-XD-OFFICIAL/TEMP-MAIL/releases/tag/TEMP-MAIL_APK" class="bg-gray-900 dark:bg-white text-white dark:text-gray-900 py-3 rounded-2xl font-bold text-center text-sm">Download APK</a>
        <button onclick="generateNewEmail()" class="bg-brand-500 text-white py-3 rounded-2xl font-bold text-sm">New Address</button>
    </div>

    <div id="toast-container" class="fixed bottom-24 left-0 right-0 flex flex-col items-center px-4 pointer-events-none"></div>

    <script>
        const API = "https://www.1secmail.com/api/v1/";
        const DOMAINS = ["1secmail.com", "1secmail.org", "1secmail.net"];
        let state = { user: '', domain: '', messages: [], timer: 600, timerId: null };

        // Simple but very stable Fetch
        async function callAPI(url) {
            try {
                const res = await fetch("https://api.allorigins.win/get?url=" + encodeURIComponent(url));
                const json = await res.json();
                return JSON.parse(json.contents);
            } catch (e) {
                // Second backup proxy
                const res = await fetch("https://corsproxy.io/?" + encodeURIComponent(url));
                return await res.json();
            }
        }

        async function generateNewEmail() {
            const el = document.getElementById('email-address');
            el.innerHTML = '<span class="pulse text-brand-500">Generating...</span>';
            
            // Randomly create locally - 1secmail accepts any username instantly
            const user = Math.random().toString(36).substring(2, 12);
            const domain = DOMAINS[Math.floor(Math.random() * DOMAINS.length)];
            
            state.user = user;
            state.domain = domain;
            el.innerText = `${user}@${domain}`;
            
            state.messages = [];
            renderInbox();
            showToast("New Address Created!");
            resetTimer();
        }

        async function fetchMessages() {
            if (!state.user) return;
            const url = `${API}?action=getMessages&login=${state.user}&domain=${state.domain}`;
            const msgs = await callAPI(url);
            if (msgs && msgs.length !== state.messages.length) {
                state.messages = msgs;
                showToast("New Email Received!", "success");
                renderInbox();
            }
        }

        function renderInbox() {
            const list = document.getElementById('inbox-list');
            document.getElementById('inbox-count').innerText = state.messages.length;
            list.innerHTML = state.messages.length ? '' : '<li class="text-center py-10 opacity-60">Inbox is empty</li>';
            
            state.messages.forEach(m => {
                const li = document.createElement('li');
                li.className = "bg-white dark:bg-gray-800 p-4 rounded-2xl border dark:border-gray-700 active:scale-95 transition-all cursor-pointer mb-2 shadow-sm";
                li.onclick = async () => {
                    const data = await callAPI(`${API}?action=readMessage&login=${state.user}&domain=${state.domain}&id=${m.id}`);
                    document.getElementById('view-meta').innerHTML = `<div class="text-xs font-bold text-brand-500 mb-1">FROM: ${data.from}</div><div class="text-sm font-bold">${data.subject}</div>`;
                    document.getElementById('view-frame').srcdoc = data.htmlBody || `<div style="padding:20px;font-family:sans-serif">${data.textBody}</div>`;
                    document.getElementById('email-view').classList.remove('translate-x-full');
                };
                li.innerHTML = `<div class="font-bold text-sm text-brand-600">${m.from}</div><div class="text-xs opacity-60 truncate">${m.subject || '(No Subject)'}</div>`;
                list.appendChild(li);
            });
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const div = document.createElement('div');
            div.className = "bg-gray-800 text-white px-6 py-3 rounded-2xl shadow-xl text-xs font-bold toast-enter mb-2";
            div.innerText = msg;
            container.appendChild(div);
            setTimeout(() => div.classList.add('toast-visible'), 10);
            setTimeout(() => { div.classList.remove('toast-visible'); setTimeout(() => div.remove(), 300); }, 3000);
        }

        function resetTimer() {
            state.timer = 600;
            if (state.timerId) clearInterval(state.timerId);
            state.timerId = setInterval(() => {
                state.timer--;
                const m = Math.floor(state.timer / 60), s = state.timer % 60;
                document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0'+s : s}`;
            }, 1000);
        }

        function copyToClipboard() {
            navigator.clipboard.writeText(`${state.user}@${state.domain}`);
            showToast("Copied to Clipboard!");
        }

        function closeEmail() { document.getElementById('email-view').classList.add('translate-x-full'); }

        window.onload = () => {
            document.getElementById('theme-toggle').onclick = () => document.documentElement.classList.toggle('dark');
            document.getElementById('loading-bar').style.width = '100%';
            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                setTimeout(() => { 
                    document.getElementById('splash-screen').remove(); 
                    generateNewEmail(); 
                    setInterval(fetchMessages, 7000);
                }, 500);
            }, 1000);
        };
    </script>
</body>
</html>
