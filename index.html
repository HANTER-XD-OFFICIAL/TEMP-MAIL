    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',

                extend: {
                    fontFamily: { sans: ['Space Grotesk', 'sans-serif'] },
                    colors: { brand: { 50: '#f5f3ff', 100: '#ede9fe', 500: '#8b5cf6', 600: '#7c3aed', 900: '#4c1d95' } },
                    animation: { 'slide-up': 'slideUp 0.4s ease-out' },

        body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }

        .fab { position: fixed; bottom: 90px; right: 20px; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4); transition: transform 0.2s; }

    <!-- EMAIL VIEWER -->
    <div id="email-view" class="fixed inset-0 z-50 bg-white dark:bg-gray-900 transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="px-5 py-4 border-b dark:border-gray-800 flex items-center justify-between">
            <button onclick="closeEmail()" class="p-2 -ml-2"><span class="material-symbols-rounded">arrow_back</span></button>
            <h2 class="font-bold">Message Details</h2>
            <div class="w-10"></div>
        </div>
        <div id="view-meta" class="p-5 bg-gray-50 dark:bg-gray-800 border-b dark:border-gray-700"></div>
        <iframe id="view-frame" class="flex-1 w-full bg-white"></iframe>
    </div>

    <!-- TOAST -->
    <div id="toast-container" class="fixed bottom-24 left-1/2 transform -translate-x-1/2 flex flex-col items-center gap-2 z-50 w-full px-4 pointer-events-none"></div>

    <script>
        // Use 1secmail - Most stable for public client-side apps
        const API = "https://www.1secmail.com/api/v1/";
        const PROXIES = [
            "https://api.allorigins.win/get?url=",
            "https://corsproxy.io/?",
            "" // Direct
        ];
        
        let state = { user: '', domain: '', full: '', messages: [], timer: 600, timerId: null };

        // Optimized Fetch with multi-proxy fallback
        async function fetchSmart(url) {
            for (let proxy of PROXIES) {
                try {
                    const finalUrl = proxy ? proxy + encodeURIComponent(url) : url;
                    const response = await fetch(finalUrl);
                    if (!response.ok) continue;
                    const data = await response.json();
                    // AllOrigins wraps the result in a 'contents' property
                    return proxy.includes('allorigins') ? JSON.parse(data.contents) : data;
                } catch (e) { console.warn("Proxy failed, trying next..."); }
            }
            return null;
        }

        async function generateNewEmail() {
            const el = document.getElementById('email-address');
            el.innerHTML = '<span class="pulse text-brand-500">Connecting...</span>';
            
            // Randomly generate local username for 1secmail (instant)
            const user = Math.random().toString(36).substring(2, 12);
            const domainRes = await fetchSmart(API + "?action=getDomainList");
            const domain = domainRes ? domainRes[0] : "1secmail.com";
            
            state.user = user;
            state.domain = domain;
            state.full = `${user}@${domain}`;
            
            el.innerText = state.full;
            state.messages = [];
            renderInbox();
            showToast("New Address Ready!", "success");
            resetTimer();
        }

        async function fetchMessages() {
            if (!state.user) return;
            const url = `${API}?action=getMessages&login=${state.user}&domain=${state.domain}`;
            const msgs = await fetchSmart(url);
            if (msgs && msgs.length !== state.messages.length) {
                state.messages = msgs;
                if(msgs.length > 0) showToast("New Mail Received!", "success");
                renderInbox();
            }
        }

        function renderInbox() {
            const list = document.getElementById('inbox-list');
            document.getElementById('inbox-count').innerText = state.messages.length;
            if (state.messages.length === 0) {
                list.innerHTML = '<li class="flex flex-col items-center py-10 opacity-60"><span class="material-symbols-rounded text-4xl mb-2">inbox</span><p class="text-sm">Inbox is empty</p></li>';
                return;
            }
            list.innerHTML = '';
            state.messages.forEach(m => {
                const li = document.createElement('li');
                li.className = "bg-white dark:bg-gray-800 p-4 rounded-2xl border dark:border-gray-700 active:scale-95 transition-all cursor-pointer mb-2";
                li.onclick = () => openEmail(m.id);
                li.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-bold text-sm text-brand-600">${m.from.split('@')[0]}</span>
                        <span class="text-[10px] opacity-40">${m.date.split(' ')[1]}</span>
                    </div>
                    <div class="text-xs opacity-70 truncate font-medium">${m.subject || '(No Subject)'}</div>
                `;
                list.appendChild(li);
            });
        }

        async function openEmail(id) {
            const url = `${API}?action=readMessage&login=${state.user}&domain=${state.domain}&id=${id}`;
            const data = await fetchSmart(url);
            if (!data) return showToast("Failed to load message", "error");
            
            document.getElementById('view-meta').innerHTML = `
                <div class="text-[10px] font-bold text-brand-500 mb-1 uppercase">From: ${data.from}</div>
                <div class="text-sm font-bold text-gray-800 dark:text-white">${data.subject}</div>
            `;
            const content = data.htmlBody || `<div style="font-family:sans-serif;padding:20px">${data.textBody}</div>`;
            document.getElementById('view-frame').srcdoc = `
                <style>body{font-family:sans-serif;padding:15px;line-height:1.6;color:#333}img{max-width:100%;height:auto}</style>
                ${content}
            `;
            document.getElementById('email-view').classList.remove('translate-x-full');
        }

        function closeEmail() { document.getElementById('email-view').classList.add('translate-x-full'); }

        function copyToClipboard() {
            if(!state.full) return;
            navigator.clipboard.writeText(state.full);
            showToast("Address Copied!", "success");
        }

        function showToast(msg, type) {
            const container = document.getElementById('toast-container');
            const div = document.createElement('div');
            const bg = type === 'success' ? 'bg-green-500' : 'bg-gray-800';
            div.className = `${bg} text-white px-6 py-3 rounded-2xl shadow-xl text-xs font-bold toast-enter`;
            div.innerText = msg;
            container.appendChild(div);
            setTimeout(() => div.classList.add('toast-visible'), 10);
            setTimeout(() => { div.classList.remove('toast-visible'); setTimeout(() => div.remove(), 300); }, 3000);
        }

        function resetTimer() {
            state.timer = 600;
            if (state.timerId) clearInterval(state.timerId);
            state.timerId = setInterval(() => {
                state.timer--;
                const m = Math.floor(state.timer / 60), s = state.timer % 60;
                document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0'+s : s}`;
                if (state.timer <= 0) clearInterval(state.timerId);
            }, 1000);
        }

        window.onload = () => {
            document.getElementById('theme-toggle').onclick = () => document.documentElement.classList.toggle('dark');
            document.getElementById('loading-bar').style.width = '100%';
            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                setTimeout(() => { 
                    document.getElementById('splash-screen').remove(); 
                    generateNewEmail(); 
                    setInterval(fetchMessages, 5000); // Check every 5s
                }, 500);
            }, 1000);
        };
    </script>
